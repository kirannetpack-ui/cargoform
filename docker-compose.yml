services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: cargoform
      POSTGRES_USER: cargoform
      POSTGRES_PASSWORD: cargoform
    ports:
      - "5432:5432"
    volumes:
      - cargoform_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cargoform"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - cargoform_minio:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  cargoform_postgres:
  cargoform_minio:

